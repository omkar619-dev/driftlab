# kafka-clients' log, through slf4j-simple. It goes to stderr, because stdout
# carries only the protocol's lines (DESIGN.md, Driver split, rule 2). The
# runner puts its own clock in front of each stderr line, so the log carries
# no time of its own.
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.defaultLogLevel=info
